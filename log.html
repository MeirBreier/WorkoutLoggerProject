<style>
:root{
  --ink:#12161B; --panel:#191F26; --panel2:#212932; --rule:#2B343F;
  --bone:#E6E9EC; --dim:#8A95A2; --faint:#5B6673;
  --chalk:#8FB4D9; --fail:#E4806D; --easy:#84B47F; --gold:#D2A857;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:16px;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
.hd{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--rule);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:baseline;gap:10px}
.hd h1{margin:0;font-size:17px;font-weight:500;letter-spacing:.01em}
.hd .sub{font-size:13px;color:var(--dim);font-family:var(--mono)}
.hd .gym{margin-left:auto;font-size:13px;color:var(--chalk);font-family:var(--mono);border:1px solid var(--rule);border-radius:6px;padding:3px 8px}
.wrap{padding:14px 16px 20px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
.muted{color:var(--dim)}.faint{color:var(--faint)}
.mono{font-family:var(--mono)}
.row{display:flex;gap:8px;align-items:center}
.sp{margin-left:auto}
h2{font-size:13px;font-weight:500;color:var(--dim);text-transform:none;letter-spacing:.04em;margin:22px 0 8px}
h2:first-child{margin-top:0}

.entry{border-left:2px solid var(--rule);padding:8px 0 8px 12px;margin-bottom:10px}
.entry .nm{font-size:14px;color:var(--bone);font-weight:500}
.entry .ln{font-family:var(--mono);font-size:15px;color:var(--bone);margin-top:3px;word-break:break-word;line-height:1.5}
.entry .meta{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:3px}
.entry .note{font-size:13px;color:var(--dim);margin-top:3px;font-style:italic}
.mk-f{color:var(--fail)}.mk-e{color:var(--easy)}

.pad{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--rule);padding:8px 12px;z-index:15}
.pad .ghost{font-family:var(--mono);font-size:13px;color:var(--chalk);min-height:18px;line-height:18px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;margin-bottom:6px}
.pad .ghost .ag{color:var(--gold)}
.pad .pins{margin-bottom:5px}
.pin{display:flex;gap:7px;align-items:flex-start;font-size:13px;color:#E3C48A;line-height:1.45;padding:1px 0}
.pin .mk{color:var(--gold);flex:0 0 auto;font-family:var(--mono)}
.pin .gy{color:var(--faint);font-size:11px;font-family:var(--mono);flex:0 0 auto;margin-left:auto;padding-left:8px}
.pinlist{margin-top:4px}
.pinlist .pin{border-bottom:1px solid var(--rule);padding:7px 0}
.pad input{width:100%;background:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:11px 12px;font-family:var(--mono);font-size:16px;outline:none}
.pad input:focus{border-color:var(--chalk)}
.ac{display:flex;gap:6px;overflow-x:auto;padding:7px 0 1px;scrollbar-width:none}
.ac::-webkit-scrollbar{display:none}
.ac button{flex:0 0 auto;background:var(--panel2);border:1px solid var(--rule);border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap}
.ac button.hot{border-color:var(--chalk);color:var(--chalk)}
.pad .bar{display:flex;gap:6px;align-items:center;margin-top:7px}
.pad .bar button{background:var(--panel2);border:1px solid var(--rule);border-radius:7px;padding:6px 9px;font-size:13px;font-family:var(--mono)}
.pad .bar #bAt{color:var(--chalk);font-size:15px;padding:5px 11px}
.pad .bar .go{background:var(--chalk);color:#0F1418;border-color:var(--chalk);font-weight:500;padding:6px 16px}
.pad .timer{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--dim)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--panel);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:11px 0 13px;font-size:12px;color:var(--faint);letter-spacing:.02em}
.tabs button.on{color:var(--chalk)}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px;margin-bottom:10px}
.card .t{font-size:14px;font-weight:500}
.card .d{font-family:var(--mono);font-size:13px;color:var(--dim);margin-top:4px;line-height:1.5}
.btn{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:9px 13px;font-size:14px}
.btn.pri{background:var(--chalk);color:#0F1418;border-color:var(--chalk);font-weight:500}
.btn.dgr{color:var(--fail);border-color:#4A2E2A}
.btn.sm{padding:5px 9px;font-size:13px}
.fld{width:100%;background:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;font-family:var(--mono);font-size:15px;outline:none;margin-top:6px}
.fld:focus{border-color:var(--chalk)}
label.lb{display:block;font-size:12px;color:var(--dim);margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(8,11,14,.72);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--rule);border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:500}

.res{border-bottom:1px solid var(--rule);padding:10px 0}
.res .dt{font-family:var(--mono);font-size:12px;color:var(--faint)}
.res .ln{font-family:var(--mono);font-size:14px;margin-top:2px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--gold);border:1px solid #4A3D22;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.warn{background:#2A211A;border:1px solid #4A3D22;color:#E3C48A;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}
.empty{color:var(--faint);font-size:14px;line-height:1.6;padding:18px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:9px 14px;font-size:13px;z-index:60;opacity:0;transition:opacity .18s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="hd">
  <h1 id="hdTitle">Log</h1>
  <span class="sub" id="hdDate"></span>

</div>

<div class="wrap">
  <div class="view on" id="v-log"><div id="logBody"></div></div>
  <div class="view" id="v-find"></div>
  <div class="view" id="v-list"></div>

</div>

</div>

</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
var KEY = 'wl:v1';
var mem = null, canPersist = true;

function blank() {
  return {
    settings: { gym: 'Home', gyms: ['Home'], bodyweight: 180, unit: 'lb', lastBackup: null, sessionCount: 0 },
    exercises: [], sessions: [], templates: []
  };
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    return raw ? migrate(JSON.parse(raw)) : blank();
  } catch (e) { canPersist = false; return mem || blank(); }
}
function save() {
  mem = DB;
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { canPersist = false; }
}
function migrate(d) {
  if (!d.sessions) return blank();
  for (var i = 0; i < d.sessions.length; i++)
    for (var j = 0; j < d.sessions[i].entries.length; j++)
      d.sessions[i].entries[j].sets = d.sessions[i].entries[j].sets.map(up);
  for (var k = 0; k < d.exercises.length; k++) {
    if (!d.exercises[k].type) d.exercises[k].type = 'load';
    if (!d.exercises[k].pins) d.exercises[k].pins = [];
  }
  return d;
  function up(s) {
    if (s.a) return s;
    var o = { perSide: !!s.perSide, count: s.count || 1, mark: s.mark || null };
    o.a = s.hold ? { t: 'sec', v: s.hold } : { t: 'reps', v: s.reps };
    o.i = s.w ? (s.w.bw ? { t: 'bw', delta: s.w.delta || 0 } : { t: 'wt', v: s.w.value }) : { t: 'none' };
    if (s.drops) o.drops = s.drops.map(up);
    return o;
  }
}
var DB = load();

function uid() { return Math.random().toString(36).slice(2, 9); }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function today() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function nowTime() { var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
function agoText(date) {
  var d = daysBetween(date, today());
  if (d <= 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 14) return d + ' days ago';
  if (d < 60) return Math.round(d / 7) + ' weeks ago';
  return Math.round(d / 30) + ' months ago';
}
function norm(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

/* ---------- time ---------- */
function parseClock(s) {
  var m = /^(?:(\d+):)?(\d{1,2}):(\d{2})$/.exec(s);
  if (!m) return null;
  return (m[1] ? +m[1] * 3600 : 0) + (+m[2]) * 60 + (+m[3]);
}
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? h + ':' + pad2(m) + ':' + pad2(s) : m + ':' + pad2(s);
}

/* ---------- master list ---------- */
function findExercise(name) {
  var n = norm(name); if (!n) return null;
  for (var i = 0; i < DB.exercises.length; i++) {
    var e = DB.exercises[i];
    if (norm(e.name) === n) return e;
    for (var j = 0; j < e.aliases.length; j++) if (norm(e.aliases[j]) === n) return e;
  }
  return null;
}
var DEFAULT_INC = { load: 5, distance: 5, effort: 1, free: 0 };
var TYPE_LABEL = { load: 'weight', distance: 'distance and time', effort: 'time at intensity', free: 'free form' };
function newExercise(name, opts) {
  opts = opts || {};
  var t = opts.type || 'free';
  var e = {
    id: uid(), name: name.trim(), aliases: [], gym: opts.gym || DB.settings.gym,
    type: t, increment: opts.increment || DEFAULT_INC[t], perSide: !!opts.perSide, archived: false, pins: []
  };
  DB.exercises.push(e); save(); return e;
}
function exerciseById(id) { for (var i = 0; i < DB.exercises.length; i++) if (DB.exercises[i].id === id) return DB.exercises[i]; return null; }
function sessionsToday(gym) {
  var out = [];
  for (var i = 0; i < DB.sessions.length; i++) {
    var s = DB.sessions[i];
    if (s.date === today() && s.gym === gym) out.push(s);
  }
  return out;
}
function lastUseOf(id) {
  for (var i = DB.sessions.length - 1; i >= 0; i--) {
    var s = DB.sessions[i];
    for (var j = s.entries.length - 1; j >= 0; j--) if (s.entries[j].exerciseId === id) return { date: s.date, gym: s.gym, entry: s.entries[j] };
  }
  return null;
}
function lastUseAtGym(id, gym) {
  for (var i = DB.sessions.length - 1; i >= 0; i--) {
    var s = DB.sessions[i]; if (s.gym !== gym) continue;
    for (var j = s.entries.length - 1; j >= 0; j--) if (s.entries[j].exerciseId === id) return { date: s.date, gym: s.gym, entry: s.entries[j] };
  }
  return null;
}
function useCount(id) {
  var n = 0;
  for (var i = 0; i < DB.sessions.length; i++) for (var j = 0; j < DB.sessions[i].entries.length; j++) if (DB.sessions[i].entries[j].exerciseId === id) n++;
  return n;
}
function initials(s) { return s.split(' ').map(function (w) { return w[0] || ''; }).join(''); }
function rankMatches(q) {
  var n = norm(q); if (!n) return [];
  var out = [];
  for (var i = 0; i < DB.exercises.length; i++) {
    var e = DB.exercises[i]; if (e.archived) continue;
    var names = [e.name].concat(e.aliases), best = -1;
    for (var j = 0; j < names.length; j++) {
      var nm = norm(names[j]);
      if (nm === n) best = Math.max(best, 100);
      else if (nm.indexOf(n) === 0) best = Math.max(best, 70);
      else if (nm.indexOf(n) > -1) best = Math.max(best, 45);
      else if (initials(nm) === n.replace(/ /g, '')) best = Math.max(best, 60);
    }
    if (best < 0) continue;
    var lu = lastUseOf(e.id);
    var rec = lu ? Math.max(0, 40 - daysBetween(lu.date, today())) : 0;
    out.push({ ex: e, score: best + rec + (e.gym === DB.settings.gym ? 15 : 0) + Math.min(useCount(e.id), 12) });
  }
  out.sort(function (a, b) { return b.score - a.score; });
  return out.map(function (o) { return o.ex; });
}

/* ---------- parser ---------- */
function isSetish(tok) {
  var t = tok.replace(/,$/, '');
  if (/^[:\d]/.test(t)) return true;
  if (/^(same|next)$/i.test(t)) return true;
  if (/^[+-]\d*$/.test(t)) return true;
  return false;
}
function splitLine(text) {
  var pin = null, note = '';
  var pi = text.indexOf('##');
  if (pi > -1) {
    var rest = text.slice(pi + 2), ri = rest.indexOf('//');
    pin = (ri > -1 ? rest.slice(0, ri) : rest).trim();
    text = text.slice(0, pi) + (ri > -1 ? rest.slice(ri) : '');
  }
  var ni = text.indexOf('//');
  if (ni > -1) { note = text.slice(ni + 2).trim(); text = text.slice(0, ni); }
  var toks = text.trim().split(/\s+/).filter(Boolean);
  var cut = toks.length;
  for (var i = 0; i < toks.length; i++) if (isSetish(toks[i])) { cut = i; break; }
  return { name: toks.slice(0, cut).join(' '), body: toks.slice(cut).join(' '), note: note, pin: pin };
}

var UNITS = { m: 'm', meter: 'm', meters: 'm', k: 'k', km: 'k', kilometer: 'k', kilometers: 'k', mi: 'mi', mile: 'mi', miles: 'mi', yd: 'yd', yard: 'yd', yards: 'yd', lap: 'lap', laps: 'lap', rep: 'reps', reps: 'reps', cal: 'cal', cals: 'cal', calorie: 'cal', calories: 'cal', floor: 'floor', floors: 'floor', step: 'step', steps: 'step' };

function parseAmount(s) {
  if (!s) return null;
  var m = /^:(\d{1,2})(?::(\d{2}))?$/.exec(s);
  if (m) return { t: 'sec', v: m[2] ? (+m[1]) * 60 + (+m[2]) : +m[1], colon: true };
  var c = parseClock(s);
  if (c !== null) return { t: 'sec', v: c };
  m = /^(\d+(?:\.\d+)?)([a-z]+)$/i.exec(s);
  if (m) {
    var u = UNITS[m[2].toLowerCase()];
    if (u === 'reps') return { t: 'reps', v: +m[1] };
    if (u) return { t: 'dist', v: +m[1], unit: u };
    if (m[2].toLowerCase() === 's') return { t: 'sec', v: +m[1] };
    return null;
  }
  if (/^\d+(\.\d+)?$/.test(s)) return { t: 'reps', v: +s };
  return null;
}
function parseIntensity(s, amt) {
  if (!s) return { t: 'none' };
  var m = /^bw([+-]\d+(?:\.\d+)?)?$/i.exec(s);
  if (m) return { t: 'bw', delta: m[1] ? parseFloat(m[1]) : 0 };
  var c = parseClock(s);
  if (c !== null) return { t: 'sec', v: c };
  m = /^([a-z]*)(\d+(?:\.\d+)?)([a-z%]*)$/i.exec(s);
  if (m) {
    var lab = (m[1] || '') + (m[3] || '');
    m = [m[0], m[2]];
    if (!lab && amt && amt.t === 'reps') return { t: 'wt', v: +m[1] };
    if (/^(lb|lbs|kg|kgs)$/i.test(lab)) return { t: 'wt', v: +m[1], label: lab.toLowerCase() };
    return { t: 'lvl', v: +m[1], label: lab };
  }
  return null;
}
function parseOneSet(tok) {
  var s = String(tok).trim(); if (!s) return null;
  var mark = null, m = /([!~])$/.exec(s);
  if (m) { mark = m[1]; s = s.slice(0, -1); }
  var count = 1;
  m = /x(\d+)$/i.exec(s);
  if (m) { count = +m[1]; s = s.slice(0, m.index); }
  var perSide = false;
  m = /(\/s|\/side)$/i.exec(s);
  if (m) { perSide = true; s = s.slice(0, m.index); }
  var at = s.indexOf('@');
  var ap = at > -1 ? s.slice(0, at) : s, ip = at > -1 ? s.slice(at + 1) : '';
  m = /^(\d+)x(.+)$/i.exec(ap);
  if (m) { count = +m[1]; ap = m[2]; }
  var a = parseAmount(ap); if (!a) return null;
  var i = parseIntensity(ip, a); if (!i) return null;
  return { a: a, i: i, perSide: perSide, count: count, mark: mark };
}
function rawSet(text) { return { a: { t: 'txt', text: text }, i: { t: 'none' }, count: 1, mark: null, perSide: false }; }
function tidy(chunk) { return chunk.replace(/(\d)\s+([a-z@])/gi, '$1$2').replace(/\s+/g, ''); }
function parseSets(body) {
  var chunks = body.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  var out = [];
  for (var i = 0; i < chunks.length; i++) {
    var parts = chunks[i].split('>').map(function (s) { return s.trim(); }).filter(Boolean);
    var head = parseOneSet(tidy(parts[0]));
    if (!head) { out.push(rawSet(chunks[i])); continue; }
    if (parts.length > 1) {
      head.drops = [];
      for (var k = 1; k < parts.length; k++) head.drops.push(parseOneSet(tidy(parts[k])) || rawSet(parts[k]));
    }
    out.push(head);
  }
  return { sets: out };
}
function expandSets(sets) {
  var out = [];
  for (var i = 0; i < sets.length; i++) {
    var s = sets[i], n = s.count || 1;
    for (var k = 0; k < n; k++) {
      var c = JSON.parse(JSON.stringify(s));
      c.count = 1;
      if (k < n - 1) c.mark = null;
      out.push(c);
    }
  }
  return out;
}

/* ---------- type ---------- */
function typeOfSet(s) {
  if (!s || !s.a) return 'free';
  if (s.a.t === 'reps' && (s.i.t === 'wt' || s.i.t === 'bw')) return 'load';
  if (s.a.t === 'dist' && s.i.t === 'sec') return 'distance';
  if (s.a.t === 'reps' && s.i.t === 'sec') return 'distance';
  if (s.a.t === 'sec' && (s.i.t === 'lvl' || s.i.t === 'wt' || s.i.t === 'bw')) return 'effort';
  return 'free';
}
function typeOfSets(sets) {

/* ---------- formatting ---------- */

}

}

}

}

}

/* ---------- derived ---------- */
function absWeight(i) {

  if (i.t === 'wt') return i.v;
  return 0;
}

}

  return b;
}

  if (u === 'lap') return { sec: s.i.v / s.a.v, unit: 'lap' };

}

  }

}
function entryStats(entry) {

    for (var i = 0; i < en.sets.length; i++) if (en.sets[i].a.t === 'reps') vol += totalLoad(en.sets[i]) * en.sets[i].a.v;
    if (vol) out.push(Math.round(vol) + ' ' + DB.settings.unit + ' volume');
    var b = bestE1rm(en.sets);
    if (b) out.push('e1RM ' + Math.round(b));

    var p = pace(en.sets[0]);

      if (s.i.t === 'sec') ts += s.i.v;

    if (en.sets.length > 1 && tot) out.push(trimNum(tot) + (un === 'lap' ? ' laps' : un) + ' total');

}

/* ---------- progression ---------- */
function suggest(sets, ex, mode) {
  var type = ex && ex.type ? ex.type : typeOfSets(sets);
  var inc = (ex && ex.increment) || DEFAULT_INC[type] || 0;
  var src = expandSets(sets), out = [];
  for (var i = 0; i < src.length; i++) {
    var s = JSON.parse(JSON.stringify(src[i])), step;
    if (mode === 'same' || type === 'free') step = 0;
    else if (typeof mode === 'number') step = mode;
    else step = s.mark === '~' ? inc * 2 : s.mark === '!' ? 0 : inc;
    if (step) {
      if (type === 'load') {
        if (s.i.t === 'bw') s.i.delta = (s.i.delta || 0) + step;
        else if (s.i.t === 'wt') s.i.v = Math.max(0, s.i.v + step);
      } else if (type === 'distance') {
        if (s.i.t === 'sec') s.i.v = Math.max(1, s.i.v - step);
      } else if (type === 'effort') {
        if (s.i.t === 'bw') s.i.delta = (s.i.delta || 0) + step;
        else if (s.i.t === 'lvl' || s.i.t === 'wt') s.i.v = Math.max(0, s.i.v + step);
      }
    }
    s.mark = null; delete s.drops;

  }

}
function canSuggest(ex) { return !!(ex && ex.type && ex.type !== 'free'); }


/* ---------- pins ---------- */
function addPin(ex, text, allGyms) {
  if (!text) return;
  ex.pins = ex.pins || [];
  ex.pins.push({ id: uid(), text: text, gym: allGyms ? null : DB.settings.gym });
  save();
}
function pinsFor(ex, gym) {
  if (!ex || !ex.pins) return [];
  return ex.pins.filter(function (p) { return p.gym === null || p.gym === gym; })
    .sort(function (a, b) { return (a.gym === null ? 0 : 1) - (b.gym === null ? 0 : 1); });
}
function removePin(ex, id) {
  ex.pins = (ex.pins || []).filter(function (p) { return p.id !== id; });
  save();
}


/* ---------- comparison, PRs, stalls, trends ---------- */
function entryScore(entry, type) {
  var f = flatten(entry.sets);
  if (type === 'load') return bestE1rm(f);
  if (type === 'distance') {
    var best = null;
    for (var i = 0; i < f.length; i++) {
      if (f[i].mark === '~') continue;
      var pc = pace(f[i]);
      if (pc && (best === null || pc.sec < best)) best = pc.sec;
    }
    return best === null ? null : -best;
  }
  if (type === 'effort') {
    var m = null;
    for (var j = 0; j < f.length; j++) {
      if (f[j].mark === '~') continue;
      if (f[j].i && typeof f[j].i.v === 'number' && (m === null || f[j].i.v > m)) m = f[j].i.v;
    }
    return m;
  }
  return null;
}
function allEntriesOf(id) {

    var s = DB.sessions[i];

      if (s.entries[j].exerciseId === id) out.push({ date: s.date, time: s.time || '', gym: s.gym, entry: s.entries[j] });
  }
  out.sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.time < b.time ? -1 : 1;

}
function isPR(ex, entry) {

  var all = allEntriesOf(ex.id), seenSelf = false, best = null;
  for (var i = 0; i < all.length; i++) {
    if (all[i].entry === entry) { seenSelf = true; continue; }
    if (seenSelf) continue;
    var v = entryScore(all[i].entry, ex.type);

  }

}

}

  if (ref === null) return 0;
  for (var i = 0; i < last.length; i++) {

}

  if (!ex || ex.type === 'free') return null;
  var all = allEntriesOf(ex.id), pts = [];
  for (var i = 0; i < all.length; i++) {
    var v = entryScore(all[i].entry, ex.type);
    if (v !== null) pts.push({ date: all[i].date, v: v });
  }
  if (pts.length < 3) return null;
  var first = pts[0], last = pts[pts.length - 1];
  var days = daysBetween(first.date, last.date);
  if (days < 14) return null;
  var span = days < 60 ? Math.round(days / 7) + ' weeks' : Math.round(days / 30) + ' months';
  var d = last.v - first.v;
  if (ex.type === 'distance') {
    var secs = Math.round(d);
    if (Math.abs(secs) < 2) return 'pace flat over ' + span;
    var pu = '';
    for (var z = all.length - 1; z >= 0 && !pu; z--) {
      var pz = pace(flatten(all[z].entry.sets)[0]);
      if (pz) pu = '/' + pz.unit;

    return (secs > 0 ? fmtClock(secs) + pu + ' faster' : fmtClock(-secs) + pu + ' slower') + ' over ' + span;
  }

var $ = function (id) { return document.getElementById(id); };

}

function curSession(make) {

  }

}

}

}

/* ================= LOG ================= */
function renderLog() {

  var s = curSession(false);

  else if (DB.settings.sessionCount > 0 && DB.settings.sessionCount % 12 === 0 && !backedUpRecently()) {
    h += '<div class="warn">It has been a while since you exported. Head to Data and save a copy — iOS clears browser storage on its own schedule.</div>';
  }
  var todays = sessionsToday(DB.settings.gym);

  for (var q = 0; q < todays.length; q++) if (todays[q].entries.length) anything = true;

          '<button class="sp btn sm" onclick="startFrom(\'' + rsn.id + '\')">Start</button></div>' +
          '<div class="d">' + esc(names.join(' · ')) + '</div></div>';

    }
    h += '<div class="row" style="gap:8px;flex-wrap:wrap">';

    h += '</div>';
  } else {

          (ts.closed ? ' <button class="btn sm" style="margin-left:8px" onclick="reopenSession(\'' + ts.id + '\')">reopen</button>' : '') + '</h2>';
      }

    }
    h += '<div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap">';
    if (s && s.entries.length) h += '<button class="btn sm" onclick="closeSession()">Close session</button>';

}

}

/* ---- input ---- */
function onInput() {
  var raw = $('inp').value;
  var p = splitLine(raw);
  var ex = findExercise(p.name);
  var ghost = '', chips = '', pins = '';
  if (ex) {
    var ps = pinsFor(ex, DB.settings.gym);
    for (var pi = 0; pi < ps.length; pi++)
      pins += '<div class="pin"><span class="mk">##</span><span>' + esc(ps[pi].text) + '</span>' +
        (ps[pi].gym === null ? '<span class="gy">all gyms</span>' : '') + '</div>';
    var lu = lastUseAtGym(ex.id, DB.settings.gym) || lastUseOf(ex.id);
    if (lu) {
      var st = entryStats(lu.entry);
      ghost = 'last: ' + fmtSets(collapse(lu.entry.sets)) + ' · ' + agoText(lu.date);
      if (st.length) ghost += ' · ' + st[0];
      if (lu.gym !== DB.settings.gym) ghost += '  <span class="ag">@' + esc(lu.gym) + '</span>';
      var sc = stallCount(ex, DB.settings.gym);
      if (sc) ghost += '  <span class="ag">same ' + sc + ' sessions</span>';
    } else ghost = 'first time on ' + esc(ex.name);
  } else if (p.name && !p.body) {
    var m = rankMatches(p.name).slice(0, 6);

      var lu2 = lastUseOf(m[i].id);
      chips += '<button class="' + (i === 0 ? 'hot' : '') + '" onclick="pick(\'' + m[i].id + '\')">' + esc(m[i].name) +
        (lu2 ? ' <span class="faint">' + agoText(lu2.date).replace(' ago', '') + '</span>' : '') + '</button>';
    }
    if (!m.length) ghost = 'new exercise — press log to add it';

  $('pins').innerHTML = pins;
  $('ac').innerHTML = chips;
}
function pick(id) {

  $('inp').value = ex.name + ' ' + (p.body ? p.body : '');
  $('ac').innerHTML = '';
  $('inp').focus(); onInput();
}

function submit() {
  var raw = $('inp').value.trim();
  if (!raw) return;
  var p = splitLine(raw);
  if (!p.name) { toast('Start with the exercise name.'); return; }
  var ex = findExercise(p.name);
  if (!ex) {
    var m = rankMatches(p.name);
    askNew(p, m.slice(0, 5));
    return;
  }
  commit(ex, p);
}
function commit(ex, p) {
  var sets;
  var body = p.body.trim().toLowerCase();
  if (p.pin) {
    addPin(ex, p.pin, false);
    if (!body) {
      $('inp').value = ex.name + ' ';
      onInput(); renderLog();
      toast('Pinned to ' + ex.name + ' at ' + DB.settings.gym);
      return;
    }
  }
  if (!body) { toast('Add at least one set.'); return; }
  if (body === 'same' || body === 'next' || /^[+-]\d*$/.test(body)) {
    var lu = lastUseAtGym(ex.id, DB.settings.gym) || lastUseOf(ex.id);
    if (!lu) { toast('No history for ' + ex.name + ' yet.'); return; }
    var mode = 'auto';
    if (body === 'same') mode = 'same';
    else if (/^[+-]\d+$/.test(body)) mode = parseFloat(body);
    else if (body === '-') mode = -ex.increment;
    if (mode === 'auto' && !canSuggest(ex)) {
      mode = 'same';
      toast('No progression direction for ' + ex.name + ' — repeating it.');
    }
    sets = suggest(lu.entry.sets, ex, mode);
    $('inp').value = ex.name + ' ' + fmtSets(sets);
    onInput();
    toast('Prefilled — edit it, then log.');
    return;
  }
  var r = parseSets(p.body);
  if (r.error) { toast('Could not read "' + r.error + '"'); return; }
  sets = expandSets(r.sets);
  if (ex.perSide) for (var i = 0; i < sets.length; i++) if (!sets[i].perSide) sets[i].perSide = true;
  var detected = typeOfSets(sets);
  if (ex.type === 'free' && detected !== 'free') {
    ex.type = detected;
    if (!ex.increment) ex.increment = DEFAULT_INC[detected];
  }
  var s = curSession(true);
  var newEntry = { exerciseId: ex.id, sets: sets, note: p.note || '' };
  if (window._edit) {
    var tgt = null;
    for (var e2 = 0; e2 < DB.sessions.length; e2++) if (DB.sessions[e2].id === window._edit.sid) tgt = DB.sessions[e2];
    if (tgt) tgt.entries.splice(Math.min(window._edit.idx, tgt.entries.length), 0, newEntry);
    else s.entries.push(newEntry);
    window._edit = null;
  } else {
    var existing = null;
    for (var e3 = 0; e3 < s.entries.length; e3++) if (s.entries[e3].exerciseId === ex.id) existing = s.entries[e3];
    if (existing) {
      existing.sets = existing.sets.concat(sets);
      if (p.note) existing.note = existing.note ? existing.note + '; ' + p.note : p.note;
      toast('Added to ' + ex.name);
    } else s.entries.push(newEntry);
  }
  save();
  $('inp').value = ''; $('ghost').innerHTML = ''; $('ac').innerHTML = '';
  lastLogTime = Date.now();
  renderLog();
  window.scrollTo(0, document.body.scrollHeight);
}
function askNew(p, near) {

  if (near.length) {

function confirmNew() {

      }

function pushRow(rows, s, ex, n, st, isDrop, note) {

function importText(txt) {
  var lines = txt.split(/\r?\n/);
  var date = today(), gym = DB.settings.gym, added = 0, skipped = 0, pinned = 0, pinGym = false;
  var mode = 'session', tplName = null, exCount = 0, stime = null;
  for (var i = 0; i < lines.length; i++) {
    var L = lines[i].trim();
    if (!L) continue;
    var hm = /^#\s*(\d{4}-\d{2}-\d{2})(?:\s+(\d{1,2}:\d{2}))?\s*(?:\|\s*(.+))?$/.exec(L);
    if (hm) { date = hm[1]; stime = hm[2] || null; gym = (hm[3] || gym).trim(); pinGym = false; mode = 'session'; continue; }
    if (/^#\s*settings\s*$/i.test(L)) { mode = 'settings'; continue; }
    if (/^#\s*exercises\s*$/i.test(L)) { mode = 'exercises'; continue; }
    var tm = /^#\s*template\s+(.+)$/i.exec(L);
    if (tm) { mode = 'template'; tplName = tm[1].trim(); continue; }
    var pm = /^#\s*pins\s*@\s*(.+)$/i.exec(L);
    if (pm) { mode = 'pins'; pinGym = pm[1].trim().toLowerCase() === 'all' ? null : pm[1].trim(); continue; }

    if (mode === 'settings') {
      var sm = /^([a-z]+)\s*:\s*(.+)$/i.exec(L);
      if (sm) {
        var key = sm[1].toLowerCase(), val = sm[2].trim();
        if (key === 'bodyweight') DB.settings.bodyweight = parseFloat(val) || DB.settings.bodyweight;
        else if (key === 'unit') DB.settings.unit = val;
        else if (key === 'gyms') {
          var gl = val.split(',').map(function (z) { return z.trim(); }).filter(Boolean);
          for (var gi = 0; gi < gl.length; gi++) if (DB.settings.gyms.indexOf(gl[gi]) < 0) DB.settings.gyms.push(gl[gi]);
        }
      }
      continue;
    }
    if (mode === 'exercises') {
      var f = L.split('|').map(function (z) { return z.trim(); });
      var nm = f.shift();
      if (!nm) { skipped++; continue; }
      var ex0 = findExercise(nm);
      if (!ex0) { ex0 = newExercise(nm, { gym: gym }); exCount++; }
      for (var fi = 0; fi < f.length; fi++) {
        var kv = /^([a-z]+)\s*:\s*(.+)$/i.exec(f[fi]);
        if (kv) {
          var kk = kv[1].toLowerCase(), vv = kv[2].trim();
          if (kk === 'aliases') {
            var al = vv.split(',').map(function (z) { return z.trim(); }).filter(Boolean);
            for (var ai = 0; ai < al.length; ai++) if (ex0.aliases.indexOf(al[ai]) < 0) ex0.aliases.push(al[ai]);
          } else if (kk === 'gym') ex0.gym = vv;
          else if (kk === 'type') ex0.type = vv;
          else if (kk === 'inc') ex0.increment = parseFloat(vv) || ex0.increment;
        } else if (/^perside$/i.test(f[fi])) ex0.perSide = true;
        else if (/^archived$/i.test(f[fi])) ex0.archived = true;
      }
      continue;
    }
    if (mode === 'template') {
      var names = L.split(',').map(function (z) { return z.trim(); }).filter(Boolean);
      var ids = [];
      for (var ti = 0; ti < names.length; ti++) {
        var te = findExercise(names[ti]) || newExercise(names[ti], { gym: gym });
        ids.push(te.id);
      }
      if (ids.length && !DB.templates.some(function (z) { return z.name === tplName; }))
        DB.templates.push({ id: uid(), name: tplName, exerciseIds: ids });
      continue;
    }
    if (L.indexOf('#') === 0) continue;
    var p = splitLine(L);
    if (p.pin && !p.body) {
      if (!p.name) { skipped++; continue; }
      var scope = pinGym === false ? gym : pinGym;
      var pex = findExercise(p.name) || newExercise(p.name, { gym: scope || gym });
      var dupe = (pex.pins || []).some(function (q) { return q.text === p.pin && q.gym === scope; });
      if (!dupe) { pex.pins = pex.pins || []; pex.pins.push({ id: uid(), text: p.pin, gym: scope }); pinned++; }
      continue;
    }
    if (!p.name || !p.body) { skipped++; continue; }
    if (/^(same|next|[+-]\d*)$/i.test(p.body.trim())) { skipped++; continue; }
    var r = parseSets(p.body);
    if (r.error) { skipped++; continue; }
    var ex = findExercise(p.name) || newExercise(p.name, { gym: gym });
    var sess = null;
    for (var k = 0; k < DB.sessions.length; k++)
      if (DB.sessions[k].date === date && DB.sessions[k].gym === gym && (DB.sessions[k].time || null) === stime) sess = DB.sessions[k];
    if (!sess) { sess = { id: uid(), date: date, time: stime, gym: gym, entries: [], closed: date !== today() }; DB.sessions.push(sess); }
    var impSets = expandSets(r.sets);
    var impType = typeOfSets(impSets);
    if (ex.type === 'free' && impType !== 'free') {
      ex.type = impType;
      if (!ex.increment) ex.increment = DEFAULT_INC[impType];
    }
    sess.entries.push({ exerciseId: ex.id, sets: impSets, note: p.note || '' });
    if (p.pin) { ex.pins = ex.pins || []; ex.pins.push({ id: uid(), text: p.pin, gym: gym }); pinned++; }
    added++;
  }
  DB.sessions.sort(function (a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.time || '') < (b.time || '') ? -1 : 1;
  });
  var seen = {};
  for (var z = DB.sessions.length - 1; z >= 0; z--) {
    var sz = DB.sessions[z];
    if (sz.date !== today()) { sz.closed = true; continue; }
    if (seen[sz.gym]) sz.closed = true; else { seen[sz.gym] = 1; sz.closed = false; }
  }
  save();
  return { added: added, skipped: skipped, pinned: pinned, exercises: exCount };
}
function download(name, text) {
  try {
    var b = new Blob([text], { type: 'text/plain' });
    var u = URL.createObjectURL(b);
    var a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 1000);
    DB.settings.lastBackup = today(); save();
  } catch (e) { toast('Download blocked — copy from the box instead.'); }
}
function renderData() {
  $('hdTitle').textContent = 'Data';
  var sess = DB.sessions.filter(function (s) { return s.entries.length; }).length;
  $('hdDate').textContent = sess + ' sessions';
  var h = '';
  if (!canPersist) h += '<div class="warn">This page cannot write to storage right now. Open the file directly on your device for saving to work.</div>';
  else if (!backedUpRecently()) h += '<div class="warn">No recent export. iOS clears browser storage on its own schedule — save a copy while you are thinking about it.</div>';
  h += '<h2>Export</h2>';
  h += '<div class="card"><div class="t">Shorthand text</div><div class="d">Everything: exercises, aliases, pins, templates, settings, and every session. Imports back in, so it is a complete backup.</div>' +
    '<div style="margin-top:10px"><button class="btn pri" onclick="download(\'workouts.txt\', exportText())">Save .txt</button> <button class="btn sm" onclick="showBox(exportText())">Show to copy</button></div></div>';
  h += '<div class="card"><div class="t">Spreadsheet</div><div class="d">One row per set, parsed into columns. For Excel on a real computer.</div>' +
    '<div style="margin-top:10px"><button class="btn" onclick="download(\'workouts.csv\', exportCSV())">Save .csv</button> <button class="btn sm" onclick="showBox(exportCSV())">Show to copy</button></div></div>';
  h += '<h2>Import</h2>';
  h += '<div class="card"><div class="d">Paste shorthand. Date the sessions with lines like <span class="mono">Sun Jul 12 2026</span> written as <span class="mono"># 2026-07-12 | Barbell Gym</span>. Undated lines land on today.</div>' +
    '<textarea class="fld" id="imp" rows="5" placeholder="# 2026-07-12 | Barbell Gym&#10;bench 8@135, 8@140, 6@145!" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>' +
    '<div style="margin-top:10px"><button class="btn" onclick="doImport()">Import</button></div></div>';
  h += '<h2>Settings</h2>';
  h += '<div class="card"><div class="grid2"><div><label class="lb">Bodyweight</label><input class="fld" id="sBw" value="' + DB.settings.bodyweight + '" inputmode="decimal"></div>' +
    '<div><label class="lb">Unit label</label><input class="fld" id="sUnit" value="' + esc(DB.settings.unit) + '"></div></div>' +
    '<label class="lb">Gyms (comma separated)</label><input class="fld" id="sGyms" value="' + esc(DB.settings.gyms.join(', ')) + '" autocapitalize="words">' +
    '<div style="margin-top:12px"><button class="btn pri" onclick="saveSettings()">Save settings</button></div></div>';
  h += '<div class="card"><div class="t">Erase everything</div><div class="d">Removes all sessions and exercises from this device. Export first.</div>' +
    '<div style="margin-top:10px"><button class="btn dgr" onclick="wipe()">Erase</button></div></div>';
  $('v-data').innerHTML = h;
}
function showBox(t) {
  openSheet('<h3>Copy this</h3><textarea class="fld" rows="14" onclick="this.select()" readonly>' + esc(t) + '</textarea>' +
    '<div style="margin-top:12px"><button class="btn sm" onclick="closeSheet()">Done</button></div>');
}
function doImport() {
  var t = $('imp').value;
  if (!t.trim()) { toast('Paste something first.'); return; }
  var r = importText(t);
  renderData(); renderLog();
  toast('Added ' + r.added + ' lines' + (r.exercises ? ', ' + r.exercises + ' exercises' : '') + (r.pinned ? ', ' + r.pinned + ' pins' : '') + (r.skipped ? ', skipped ' + r.skipped : ''));
}
function saveSettings() {
  DB.settings.bodyweight = parseFloat($('sBw').value) || DB.settings.bodyweight;
  DB.settings.unit = $('sUnit').value.trim() || 'lb';
  var gs = $('sGyms').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  if (gs.length) DB.settings.gyms = gs;
  if (DB.settings.gyms.indexOf(DB.settings.gym) < 0) DB.settings.gym = DB.settings.gyms[0];
  save(); renderData(); toast('Saved');
}
function wipe() {
  if (!confirm('Erase all workout data on this device?')) return;
  if (!confirm('Last chance. This cannot be undone.')) return;
  DB = blank(); save(); renderAll(); toast('Erased');
}

/* ================= chrome ================= */
function openSheet(h) { $('sheetIn').innerHTML = h; $('sheet').classList.add('on'); }
function closeSheet() { $('sheet').classList.remove('on'); }
function pickGym() {
  var h = '<h3>Gym</h3><div class="muted" style="font-size:13px">Last-time lookups are scoped to the gym you are in.</div>';
  for (var i = 0; i < DB.settings.gyms.length; i++)
    h += '<div style="margin-top:8px"><button class="btn' + (DB.settings.gyms[i] === DB.settings.gym ? ' pri' : '') + '" onclick="setGym(\'' + esc(DB.settings.gyms[i]) + '\')">' + esc(DB.settings.gyms[i]) + '</button></div>';
  h += '<label class="lb">Add a gym</label><input class="fld" id="newGym" placeholder="Hotel gym" autocapitalize="words">';
  h += '<div style="margin-top:10px"><button class="btn sm" onclick="addGym()">Add</button> <button class="btn sm" onclick="closeSheet()">Close</button></div>';
  openSheet(h);
}
function setGym(g) { DB.settings.gym = g; save(); closeSheet(); renderAll(); }
function addGym() {
  var g = $('newGym').value.trim(); if (!g) return;
  if (DB.settings.gyms.indexOf(g) < 0) DB.settings.gyms.push(g);
  DB.settings.gym = g; save(); closeSheet(); renderAll();
}
function setTab(t) {
  tab = t;
  var vs = ['log', 'find', 'list', 'data'];
  for (var i = 0; i < vs.length; i++) $('v-' + vs[i]).classList.toggle('on', vs[i] === t);
  var bs = document.querySelectorAll('.tabs button');
  for (var j = 0; j < bs.length; j++) bs[j].classList.toggle('on', bs[j].dataset.tab === t);
  $('pad').style.display = t === 'log' ? '' : 'none';
  document.body.style.paddingBottom = t === 'log' ? 'calc(210px + env(safe-area-inset-bottom))' : 'calc(64px + env(safe-area-inset-bottom))';
  $('gymBtn').style.display = t === 'data' ? 'none' : '';
  renderAll();
  window.scrollTo(0, 0);
}
function renderAll() {
  if (tab === 'log') renderLog();
  else if (tab === 'find') renderFind();
  else if (tab === 'list') renderList();
  else renderData();
}
function tick() {
  if (!lastLogTime) { $('tmr').textContent = ''; return; }
  var s = Math.floor((Date.now() - lastLogTime) / 1000);
  $('tmr').textContent = Math.floor(s / 60) + ':' + pad2(s % 60);
}

$('inp').addEventListener('input', onInput);
$('inp').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
$('bGo').addEventListener('click', submit);
$('bAt').addEventListener('click', function () { insertAt('@'); });
$('bSame').addEventListener('click', function () { quick('same'); });
$('bPlus').addEventListener('click', function () { quick('+'); });
$('bUndo').addEventListener('click', undo);
$('gymBtn').addEventListener('click', pickGym);
$('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
var tb = document.querySelectorAll('.tabs button');
for (var i = 0; i < tb.length; i++) tb[i].addEventListener('click', function () { setTab(this.dataset.tab); });

setTab('log');
tmrInt = setInterval(tick, 1000);

try {
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
} catch (e) {}

</script>
